name: Build SoundDraft
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:audio -- ${{ matrix.arch }}
      - run: npm run build
      - run: npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Checksums
        run: shasum -a 256 release/*.dmg release/*.zip > release/SHA256-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SoundDraft-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256-*.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/*.dmg
            release/*.zip
            release/SHA256-*.txt
